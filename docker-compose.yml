services:
  db:
    container_name: postgres
    image: postgres:15-alpine
    env_file: 
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis: 
    image: redis:7.4-alpine
    container_name: redis
    env_file:
     - .env
    ports:
      - '6379:6379'
    command: >
      sh -c "redis-server --save 20 1 --loglevel warning --requirepass $REDIS_PASSWORD --bind 0.0.0.0"
    volumes:
        - cache:/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s 
  

  celery_worker:
    build: .
    container_name: celery_worker
    env_file: 
      - .env
    depends_on:
      db:
        condition: "service_healthy"
      redis:
        condition: "service_healthy"
    volumes:
      - .:/app
    command: celery -A app.core.celery_app worker --loglevel=info
    restart: always


  celery_beat:
    build: .
    container_name: celery_beat
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file: 
      - .env
    depends_on:
      db:
        condition: "service_healthy"
      redis:
        condition: "service_healthy"
    restart: always


  app:
    build: .
    container_name: pricesentinel_app
    env_file: 
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: "service_healthy"
      redis:
        condition: "service_healthy"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always 
  

    

  
volumes:
  postgres_data:
  cache:
    driver: local
  